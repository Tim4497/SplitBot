services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: splitbot
      POSTGRES_USER: splitbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitbot -d splitbot"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://splitbot:${POSTGRES_PASSWORD}@db:5432/splitbot?schema=public
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  postgres_data:
