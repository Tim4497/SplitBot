name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: splitbot
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: splitbot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U splitbot -d splitbot_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://splitbot:test_password@localhost:5432/splitbot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run build
      - run: npm test
      - run: docker build -t splitbot:ci .
